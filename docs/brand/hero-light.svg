<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="460" viewBox="0 0 1280 460" role="img" aria-label="spotify-stack — a background coding agent fleet that kills its own bad work before you see it">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2=".35" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#f7fafb"/>
      <stop offset="100%" stop-color="#eef2f5"/>
    </linearGradient>
    <radialGradient id="keylight" cx="50%" cy="14%" r="62%">
      <stop offset="0%" stop-color="#1f9e7f" stop-opacity=".15"/>
      <stop offset="45%" stop-color="#1f9e7f" stop-opacity=".06"/>
      <stop offset="100%" stop-color="#1f9e7f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="rim" cx="82%" cy="86%" r="55%">
      <stop offset="0%" stop-color="#8a5f86" stop-opacity=".11"/>
      <stop offset="100%" stop-color="#8a5f86" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx="50%" cy="45%" r="78%">
      <stop offset="55%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#8fa0ad" stop-opacity=".20"/>
    </radialGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1f9e7f" stop-opacity="0"/>
      <stop offset="50%" stop-color="#1f9e7f" stop-opacity=".7"/>
      <stop offset="100%" stop-color="#1f9e7f" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fadeL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fadeR" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#eef2f5" stop-opacity="0"/>
      <stop offset="100%" stop-color="#eef2f5"/>
    </linearGradient>

    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".82" numOctaves="3" seed="7"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <filter id="bloom" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <filter id="softbloom" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>

    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif; }

      /* One 7s clock. Every delay below is a position on it, so the pulse,
         the connector it is crossing, and the stage it lands on stay in step.
           dwell  task 0.14  agent 1.12  scope 2.10  verify 3.22  judge 4.34  PR 5.53
           cross  0.56       1.68        2.80        3.92         5.04                */
      .pulse { animation: march 7s linear infinite; }

      .ping  { animation: ping 7s linear infinite; }
      .p-task   { animation-delay: .14s; }
      .p-agent  { animation-delay: 1.12s; }
      .p-scope  { animation-delay: 2.10s; }
      .p-verify { animation-delay: 3.22s; }
      .p-judge  { animation-delay: 4.34s; }
      .p-pr     { animation-delay: 5.53s; }

      .lit   { animation: ignite 7s linear infinite; opacity: 0; }
      .l-scope  { animation-delay: 2.10s; }
      .l-verify { animation-delay: 3.22s; }
      .l-judge  { animation-delay: 4.34s; }
      .l-pr     { animation-delay: 5.53s; }

      .lnk   { animation: cross 7s linear infinite; opacity: 0; }
      .c-1 { animation-delay:  .56s; }
      .c-2 { animation-delay: 1.68s; }
      .c-3 { animation-delay: 2.80s; }
      .c-4 { animation-delay: 3.92s; }
      .c-5 { animation-delay: 5.04s; }

      .kill { animation: flicker 7s linear infinite; animation-delay: 3.22s; }
      .halo { animation: breathe 9s ease-in-out infinite; }

      /* Hold at each stage, then hop to the next. The timing function on a
         keyframe governs the segment that *starts* there — so every hop eases
         in and out, and every dwell is dead still. */
      @keyframes march {
        0%           { transform: translateX(0px);   opacity: 0; }
        2%           { transform: translateX(0px);   opacity: 1; }
        8%           { transform: translateX(0px);   opacity: 1; animation-timing-function: cubic-bezier(.7,0,.3,1); }
        16%          { transform: translateX(204px); opacity: 1; }
        24%          { transform: translateX(204px); opacity: 1; animation-timing-function: cubic-bezier(.7,0,.3,1); }
        30%          { transform: translateX(366px); opacity: 1; }
        40%          { transform: translateX(366px); opacity: 1; animation-timing-function: cubic-bezier(.7,0,.3,1); }
        46%          { transform: translateX(488px); opacity: 1; }
        56%          { transform: translateX(488px); opacity: 1; animation-timing-function: cubic-bezier(.7,0,.3,1); }
        62%          { transform: translateX(610px); opacity: 1; }
        72%          { transform: translateX(610px); opacity: 1; animation-timing-function: cubic-bezier(.7,0,.3,1); }
        79%          { transform: translateX(789px); opacity: 1; }
        93%          { transform: translateX(789px); opacity: 1; }
        100%         { transform: translateX(789px); opacity: 0; }
      }

      /* the ring each stage throws off as the pulse lands on it */
      @keyframes ping {
        0%       { r: 6;  opacity: .55; }
        9%       { r: 26; opacity: 0; }
        100%     { r: 26; opacity: 0; }
      }

      @keyframes ignite {
        0%       { opacity: 0; }
        2%       { opacity: 1; }
        9%       { opacity: .55; }
        17%      { opacity: 0; }
        100%     { opacity: 0; }
      }

      /* the connector brightens only while the pulse is crossing it */
      @keyframes cross {
        0%       { opacity: 0; }
        3%       { opacity: 1; }
        8%       { opacity: .5; }
        13%      { opacity: 0; }
        100%     { opacity: 0; }
      }

      @keyframes flicker {
        0%       { opacity: .5; }
        3%       { opacity: 1; }
        14%      { opacity: .62; }
        100%     { opacity: .5; }
      }
      @keyframes breathe {
        0%, 100% { opacity: .75; }
        50%      { opacity: 1; }
      }

      @media (prefers-reduced-motion: reduce) {
        .pulse, .ping, .lit, .lnk, .kill, .halo { animation: none; }
        .pulse, .ping, .lnk { opacity: 0; }
        .lit  { opacity: .55; }
        .kill { opacity: .72; }
      }
    </style>
  </defs>

  <!-- ── plate ─────────────────────────────────────────────── -->
  <rect width="1280" height="460" fill="url(#bg)"/>
  <rect class="halo" width="1280" height="460" fill="url(#keylight)"/>
  <rect width="1280" height="460" fill="url(#rim)"/>

  <!-- horizon grid, fading at both edges -->
  <g stroke="#1f9e7f" stroke-opacity=".08">
    <path d="M0 96h1280M0 192h1280M0 288h1280M0 384h1280"/>
    <path d="M128 0v460M256 0v460M384 0v460M512 0v460M640 0v460M768 0v460M896 0v460M1024 0v460M1152 0v460"/>
  </g>
  <rect width="230" height="460" fill="url(#fadeL)"/>
  <rect x="1050" width="230" height="460" fill="url(#fadeR)"/>
  <rect width="1280" height="460" fill="url(#vignette)"/>
  <rect width="1280" height="460" filter="url(#grain)" opacity=".025"/>

  <!-- ── type ──────────────────────────────────────────────── -->
  <g class="mono" text-anchor="middle">
    <text x="640" y="152" font-size="64" font-weight="700" fill="#1f9e7f" opacity=".22" filter="url(#softbloom)" letter-spacing="-1.6">spotify-stack</text>
    <text x="640" y="152" font-size="64" font-weight="700" fill="#1f2328" letter-spacing="-1.6">spotify<tspan fill="#1f9e7f">-</tspan>stack</text>
  </g>

  <g class="sans" text-anchor="middle" font-size="25" font-weight="500" fill="#59636e">
    <text x="640" y="208">A background coding agent fleet that kills its own</text>
    <text x="640" y="242">bad work <tspan fill="#1f2328" font-weight="700">before you see it</tspan>.</text>
  </g>

  <rect x="450" y="278" width="380" height="1" fill="url(#rule)"/>

  <!-- ── gate chain ────────────────────────────────────────── -->
  <g class="mono" font-size="13" font-weight="600" text-anchor="middle">

    <!-- arrival rings sit under the stages so they read as emanating from them -->
    <g fill="none" stroke-width="1.8">
      <circle class="ping p-task"   cx="271"  cy="351" r="6" stroke="#8b98a3" opacity="0"/>
      <circle class="ping p-agent"  cx="475"  cy="351" r="6" stroke="#8b98a3" opacity="0"/>
      <circle class="ping p-scope"  cx="637"  cy="351" r="6" stroke="#0d9488" opacity="0"/>
      <circle class="ping p-verify" cx="759"  cy="351" r="6" stroke="#0d9488" opacity="0"/>
      <circle class="ping p-judge"  cx="881"  cy="351" r="6" stroke="#0d9488" opacity="0"/>
      <circle class="ping p-pr"     cx="1060" cy="351" r="6" stroke="#8a5f86" opacity="0"/>
    </g>

    <g>
      <rect x="196" y="330" width="150" height="42" rx="21" fill="#ffffff" stroke="#d1d9e0"/>
      <text x="271" y="356" fill="#59636e">task prompt</text>
    </g>

    <path d="M356 351h40" stroke="#d1d9e0" stroke-width="1.5"/>
    <path d="M390 346l8 5-8 5z" fill="#c3ccd4"/>
    <g class="lnk c-1">
      <path d="M356 351h40" stroke="#4a5560" stroke-width="2"/>
      <path d="M390 346l8 5-8 5z" fill="#4a5560"/>
    </g>

    <g>
      <rect x="410" y="330" width="130" height="42" rx="21" fill="#ffffff" stroke="#d1d9e0"/>
      <text x="475" y="356" fill="#59636e">caged agent</text>
    </g>

    <path d="M550 351h30" stroke="#d1d9e0" stroke-width="1.5"/>
    <path d="M574 346l8 5-8 5z" fill="#c3ccd4"/>
    <g class="lnk c-2">
      <path d="M550 351h30" stroke="#4a5560" stroke-width="2"/>
      <path d="M574 346l8 5-8 5z" fill="#4a5560"/>
    </g>

    <g>
      <rect x="594" y="330" width="86" height="42" rx="21" fill="#e9f7f2" stroke="#1f9e7f"/>
      <rect class="lit l-scope" x="594" y="330" width="86" height="42" rx="21" fill="none" stroke="#0d9488" stroke-width="1.9"/>
      <text x="637" y="356" fill="#0f766e">scope</text>
    </g>

    <path d="M690 351h20" stroke="#1f9e7f" stroke-width="1.5"/>
    <path class="lnk c-3" d="M690 351h20" stroke="#0b6b55" stroke-width="2.4"/>

    <g>
      <rect x="716" y="330" width="86" height="42" rx="21" fill="#e9f7f2" stroke="#1f9e7f"/>
      <rect class="lit l-verify" x="716" y="330" width="86" height="42" rx="21" fill="none" stroke="#0d9488" stroke-width="1.9"/>
      <text x="759" y="356" fill="#0f766e">verify</text>
    </g>

    <path d="M812 351h20" stroke="#1f9e7f" stroke-width="1.5"/>
    <path class="lnk c-4" d="M812 351h20" stroke="#0b6b55" stroke-width="2.4"/>

    <g>
      <rect x="838" y="330" width="86" height="42" rx="21" fill="#e9f7f2" stroke="#1f9e7f"/>
      <rect class="lit l-judge" x="838" y="330" width="86" height="42" rx="21" fill="none" stroke="#0d9488" stroke-width="1.9"/>
      <text x="881" y="356" fill="#0f766e">judge</text>
    </g>

    <path d="M934 351h30" stroke="#8a5f86" stroke-width="1.5"/>
    <path d="M958 346l8 5-8 5z" fill="#8a5f86"/>
    <g class="lnk c-5">
      <path d="M934 351h30" stroke="#6b4568" stroke-width="2"/>
      <path d="M958 346l8 5-8 5z" fill="#6b4568"/>
    </g>

    <g>
      <rect x="978" y="330" width="164" height="42" rx="21" fill="#f7eef6" stroke="#8a5f86"/>
      <rect class="lit l-pr" x="978" y="330" width="164" height="42" rx="21" fill="none" stroke="#6b4568" stroke-width="1.9"/>
      <text x="1060" y="356" fill="#6b4568">PR to co-sign</text>
    </g>

    <!-- the run itself -->
    <g class="pulse">
      <circle cx="271" cy="351" r="9" fill="#1f9e7f" opacity=".40" filter="url(#bloom)"/>
      <circle cx="271" cy="351" r="2.8" fill="#0b6b55"/>
    </g>
  </g>

  <!-- ── kill drop ─────────────────────────────────────────── -->
  <g class="kill" opacity=".5" fill="none" stroke="#c74450" stroke-width="1.5" stroke-dasharray="3 4">
    <path d="M637 374v10q0 6 6 6h110"/>
    <path d="M759 374v16"/>
    <path d="M881 374v10q0 6-6 6H765"/>
  </g>
  <g class="kill" opacity=".5">
    <rect x="641" y="390" width="236" height="34" rx="17" fill="#fdeef0" stroke="#c74450"/>
    <text class="mono" x="759" y="412" font-size="12" font-weight="600" text-anchor="middle" fill="#991b26">killed · reason on record</text>
  </g>
</svg>
