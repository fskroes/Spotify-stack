name: agent-task
run-name: "agent: ${{ inputs.task_id }} on ${{ inputs.target_repo }}"

on:
  workflow_dispatch:
    inputs:
      task_id:
        description: "Task id (file under tasks/, without .md)"
        required: true
        type: string
      target_repo:
        description: "Repo name from fleet/repos.yaml"
        required: true
        type: string
  workflow_call:
    inputs:
      task_id:
        required: true
        type: string
      target_repo:
        required: true
        type: string
    secrets:
      ANTHROPIC_API_KEY:
        required: true
      FLEET_GH_TOKEN:
        required: true

# contents: write so the final step can push the run's fleet/ledger.jsonl
# line back to main — the committed shipped/killed record.
permissions:
  contents: write

jobs:
  agent:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_OWNER: ${{ github.repository_owner }}
      # Fine-grained PAT with contents+PR write on the target repos — the
      # runner uses it to clone, push the agent branch, and open the PR.
      GH_TOKEN: ${{ secrets.FLEET_GH_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install workspace
        run: pnpm install --frozen-lockfile

      - name: Detect target language
        id: lang
        run: echo "language=$(pnpm exec tsx scripts/repo-language.ts '${{ inputs.target_repo }}')" >> "$GITHUB_OUTPUT"

      - name: Install Swift
        if: steps.lang.outputs.language == 'swift'
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: "5.10"

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Authenticate git for pushes
        run: gh auth setup-git

      - name: Run agent
        run: >
          pnpm fleet run '${{ inputs.task_id }}'
          --repo '${{ inputs.target_repo }}'
          --pr

      # Only the review-safe archive and sanitized canonical usage evidence leave
      # the runner. Raw Claude transcripts remain local diagnostics.
      - name: Stage review-safe run artifacts
        if: always()
        run: |
          # Staging dir must NOT be hidden: actions/upload-artifact@v4 excludes
          # hidden paths by default (include-hidden-files defaults to false), and
          # a dot-prefixed container like `.fleet-upload` is itself hidden — every
          # file under it would be skipped ("No files were found"). Keep the
          # default hidden-file exclusion as defense-in-depth against stray
          # dotfiles; the container just can't start with a dot.
          rm -rf fleet-upload
          mkdir -p fleet-upload
          # Per-run review archive (diff/verify/verdict/result/pr-preview/model-usage),
          # kept under its run-id path so CloudArtifactSync attributes each file to
          # its run. A fresh CI checkout only holds this run's archive, so this
          # never collides with a prior run's model-usage.json. Dotfiles are
          # excluded so the injected .fleet-knowledge.md (private-target structure,
          # deliberately outside REVIEW_ARTIFACTS) never leaves the runner.
          if [ -d artifacts/runs ]; then
            find artifacts/runs -mindepth 2 -maxdepth 2 -type f ! -name '.*' -exec cp --parents {} fleet-upload/ \;
          fi
          # Canonical per-run usage evidence is gitignored (machine-local), so it
          # never appears in `git diff` — enumerate the newly-written *untracked*
          # files instead. This is deliberately not `git diff`: an untracked file
          # is not a diff, and this excludes the committed baseline evidence while
          # capturing exactly this run's fleet/evidence/<runId>/model-usage.json.
          #
          # Named to that one file rather than sweeping the directory: the store
          # also holds the retained kill (ADR-0015), whose diff and killing
          # artefact are private target prose, and whose scope-violation.json is
          # deliberately outside REVIEW_ARTIFACTS. This upload is a public-repo
          # artifact — the same reason dotfiles are excluded above.
          git ls-files --others -- 'fleet/evidence/*/model-usage.json' | while read -r file; do
            [ -n "$file" ] && cp --parents "$file" fleet-upload/
          done
          echo "staged for upload:"
          find fleet-upload -type f | sort

      - name: Upload run artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "${{ inputs.task_id }}-${{ inputs.target_repo }}"
          path: fleet-upload/
          if-no-files-found: ignore

      # Runs even when the fleet run failed — kills matter most in the record.
      # git push uses the credentials persisted by actions/checkout
      # (GITHUB_TOKEN), which the contents: write permission covers.
      - name: Commit the run's ledger line to main
        if: always()
        run: |
          # Only the ledger line is committed. The canonical per-run usage
          # evidence stays gitignored (machine-local) and reaches reviewers via
          # the uploaded artifact — the ledger line carries the actionsArtifact
          # pointer to pull it. `git add fleet/evidence` here would hit an ignored
          # path and abort the step under `set -e`.
          if git diff --quiet -- fleet/ledger.jsonl; then
            echo "no ledger change to record"
            exit 0
          fi
          git config user.name "Honk Fleet Runner"
          git config user.email "fleet@users.noreply.github.com"
          git add fleet/ledger.jsonl
          git commit -m "ledger: ${{ inputs.task_id }} on ${{ inputs.target_repo }}"
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              exit 0
            fi
            git pull --rebase origin main
          done
          echo "failed to push the ledger line after 5 attempts" >&2
          exit 1
